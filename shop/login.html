{% extends "shop/base.html" %}
{% load static %}

{% block title %}Login | UB Sushi{% endblock %}

{% block content %}

<style>

/* ===== Floating Sushi Background ===== */
.login-bg {
    background: url("{% static 'shop/images/sushi-bg.png' %}") repeat;
    animation: floatBg 25s linear infinite;
    padding: 80px 0;
}

@keyframes floatBg {
    0% { background-position: 0 0; }
    100% { background-position: 1000px 0; }
}

/* ===== Login Container ===== */
.login-container {
    width: 400px;
    margin: auto;
    background: rgba(206, 22, 190, 0.95);
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    text-align: center;
    transform: translateY(-40px);
    opacity: 0;
    transition: all 0.6s ease;
}

.login-container.show {
    transform: translateY(0);
    opacity: 1;
}

/* Header */
.login-container h2 {
    margin-bottom: 20px;
    color: #4015dd;
}

/* Form Fields */
.login-container input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid #0ceb8e;
    font-size: 16px;
}

/* Button */
.login-container button {
    margin-top: 15px;
    padding: 12px 25px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: #E63946;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 6px #c92f3b;
    transition: 0.2s ease;
    width: 100%;
}

.login-container button:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px #c92f3b;
}

.login-container button:active {
    transform: translateY(2px);
    box-shadow: 0 3px #c92f3b;
}

/* Messages */
.messages {
    background: #eafff2;
    border: 1px solid #c3e6cb;
    color: #0a7d3b;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
}

</style>

<div class="login-bg">

    <div class="login-container" id="loginBox">

        <h2>🍣 Welcome Back</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

    </div>

</div>

<script>
window.addEventListener("DOMContentLoaded", function() {
    document.getElementById("loginBox").classList.add("show");
});
</script>

{% endblock %}
