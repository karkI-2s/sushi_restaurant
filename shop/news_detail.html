{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{ news.title }}</title>

<style>

body{
    font-family: Arial;
    background:#f4f4f4;
    margin:0;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#ff512f,#dd2476);
    color:white;
    padding:50px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:42px;
}

/* CONTENT */
.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:40px 25px;
}

.date{
    color:gray;
    margin-bottom:20px;
}

.description{
    line-height:1.8;
    margin-bottom:35px;
    font-size:17px;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
    margin-bottom:40px;
}

.gallery img{
    width:100%;
    border-radius:10px;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.05);
}

/* VIDEO */
.video video{
    width:100%;
    border-radius:10px;
    margin-bottom:20px;
}

/* FEATURED */
.featured{
    margin-top:50px;
    padding:25px;
    background:#111;
    color:white;
    border-radius:10px;
    text-align:center;
}

.featured video{
    width:100%;
    margin-top:15px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="header">
    <h1>{{ news.title }}</h1>
</div>

<div class="container">

    <div class="date">{{ news.date }}</div>

    <div class="description">
        {{ news.description }}
    </div>

    <!-- PHOTO GALLERY -->
    <h2>Event Photos</h2>
    <div class="gallery">
        {% for photo in news.photos %}
            <img src="{% static photo %}" alt="">
        {% endfor %}
    </div>

    <!-- VIDEOS -->
    <h2>Event Videos</h2>
    <div class="video">
        {% for video in news.videos %}
        <video controls>
            <source src="{% static video %}" type="video/mp4">
        </video>
        {% endfor %}
    </div>

    <!-- FEATURED VIDEO (ALL PAGES) -->
    <div class="featured">
        <h2>{{ news.featured_title }}</h2>
        <p>{{ news.featured_description }}</p>

        <video controls>
            <source src="{% static news.featured_video %}" type="video/mp4">
        </video>
    </div>

</div>

</body>
</html>
