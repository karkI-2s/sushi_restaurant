{% extends "shop/base.html" %}
{% load static %}

{% block title %}Logout | UB Sushi{% endblock %}

{% block content %}

<style>

/* ===== Background ===== */
.logout-bg {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    padding: 100px 0;
    min-height: 70vh;
}

/* ===== Logout Card ===== */
.logout-container {
    width: 420px;
    margin: auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    transform: translateY(-40px);
    opacity: 0;
    transition: all 0.6s ease;
}

.logout-container.show {
    transform: translateY(0);
    opacity: 1;
}

/* Heading */
.logout-container h2 {
    color: #E63946;
    margin-bottom: 15px;
}

/* Text */
.logout-container p {
    margin-bottom: 25px;
    font-size: 16px;
}

/* Button */
.logout-container button {
    padding: 12px 30px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: #E63946;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px #c92f3b;
    transition: 0.2s ease;
}

.logout-container button:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px #c92f3b;
}

.logout-container button:active {
    transform: translateY(2px);
    box-shadow: 0 3px #c92f3b;
}

/* Cancel Link */
.cancel-link {
    display: block;
    margin-top: 20px;
    text-decoration: none;
    color: #555;
    font-size: 14px;
}

.cancel-link:hover {
    color: #E63946;
}

</style>

<div class="logout-bg">

    <div class="logout-container" id="logoutBox">
        <h2>🍣 Logout</h2>
        <p>Are you sure you want to log out?</p>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

        <a href="{% url 'index' %}" class="cancel-link">Cancel and go back</a>
    </div>

</div>

<script>
window.addEventListener("DOMContentLoaded", function() {
    document.getElementById("logoutBox").classList.add("show");
});
</script>

{% endblock %}
